// =============================================================================
// Module: Transport
// File: proto/messaging.proto
// Responsible Member: All Members (Shared Infrastructure)
// Purpose: Protocol Buffers definition for all gRPC services and messages
//          used in the distributed messaging system. Defines two services:
//
//   1. ConsensusService — Inter-node RPCs for Raft consensus:
//      - RequestVote:    sent by Candidates to request votes during elections
//      - AppendEntries:  sent by Leader for log replication and heartbeats
//
//   2. MessagingService — Client-facing RPCs:
//      - Publish:  clients send messages to be replicated across the cluster
//      - Consume:  clients retrieve committed messages
//
// Connections:
//   - Implemented by internal/transport/grpc_server.go (server side).
//   - Called by internal/transport/grpc_client.go (client side).
//   - Message types map to Go structs in internal/consensus/state.go.
//
// To regenerate Go code from this proto file, run:
//   make proto
// =============================================================================

syntax = "proto3";

package messaging;

option go_package = "distributed-messaging-system/internal/transport/proto";

// ---------------------------------------------------------------------------
// ConsensusService: Inter-node RPCs for Raft consensus protocol
// ---------------------------------------------------------------------------
service ConsensusService {
  // RequestVote is sent by a Candidate to request a vote during leader election.
  // Receivers check the candidate's term and log freshness before granting a vote.
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // AppendEntries is sent by the Leader to replicate log entries to followers.
  // When Entries is empty, it serves as a heartbeat to prevent elections.
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

// ---------------------------------------------------------------------------
// MessagingService: Client-facing RPCs for publishing and consuming messages
// ---------------------------------------------------------------------------
service MessagingService {
  // Publish sends a new message to the cluster via the Leader.
  // The message is replicated and committed before a response is returned.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Consume retrieves committed messages starting from a given index.
  rpc Consume(ConsumeRequest) returns (ConsumeResponse);
}

// ---------------------------------------------------------------------------
// Consensus RPC Messages
// ---------------------------------------------------------------------------

// RequestVoteRequest is sent by a Candidate node during leader election.
message RequestVoteRequest {
  uint64 term = 1;           // candidate's current term
  string candidate_id = 2;   // unique ID of the candidate
  uint64 last_log_index = 3; // index of candidate's last log entry
  uint64 last_log_term = 4;  // term of candidate's last log entry
}

// RequestVoteResponse is returned by a node after processing RequestVote.
message RequestVoteResponse {
  uint64 term = 1;       // responding node's current term
  bool vote_granted = 2; // true if the vote was granted
}

// AppendEntriesRequest is sent by the Leader to replicate entries or heartbeat.
message AppendEntriesRequest {
  uint64 term = 1;              // leader's current term
  string leader_id = 2;         // leader's ID (so followers can redirect clients)
  uint64 prev_log_index = 3;    // index of entry just before the new ones
  uint64 prev_log_term = 4;     // term of prev_log_index entry
  repeated LogEntry entries = 5; // new entries (empty = heartbeat)
  uint64 leader_commit = 6;     // leader's commit index
}

// AppendEntriesResponse is returned by a Follower after processing AppendEntries.
message AppendEntriesResponse {
  uint64 term = 1;    // follower's current term
  bool success = 2;   // true if log matched at prev_log_index/prev_log_term
}

// LogEntry represents a single entry in the replicated log.
message LogEntry {
  uint64 index = 1;     // 1-based position in the log
  uint64 term = 2;      // term when the entry was created
  uint64 timestamp = 3; // Lamport logical clock timestamp
  bytes data = 4;       // raw message payload
}

// ---------------------------------------------------------------------------
// Messaging RPC Messages
// ---------------------------------------------------------------------------

// PublishRequest is sent by a client to publish a new message.
message PublishRequest {
  bytes message = 1; // the message payload to publish
}

// PublishResponse confirms that a message was committed.
message PublishResponse {
  bool success = 1;      // true if the message was committed
  uint64 index = 2;      // the assigned log index
  uint64 timestamp = 3;  // the assigned Lamport timestamp
}

// ConsumeRequest is sent by a client to retrieve committed messages.
message ConsumeRequest {
  uint64 from_index = 1; // start reading from this log index
}

// ConsumeResponse returns a batch of committed messages.
message ConsumeResponse {
  repeated LogEntry messages = 1; // the committed messages
}
